name: Metrics

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, metadata
          config_timezone: Asia/Kolkata
          config_animations: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 5
          plugin_languages_analysis_timeout_repositories: 5
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_achievements: yes
          plugin_achievements_threshold: C
          use_prebuilt_image: false

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/project-expense-visualizer.svg
          template: repository
          repo: OmParida89/Smart-Expense-Visualizer
          config_animations: yes
          use_prebuilt_image: false

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/project-github-analyzer.svg
          template: repository
          repo: OmParida89/github-profile-analyzer
          config_animations: yes
          use_prebuilt_image: false

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/project-examchain.svg
          template: repository
          repo: OmParida89/ExamChain-AI
          config_animations: yes
          use_prebuilt_image: false

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/project-attrition.svg
          template: repository
          repo: OmParida89/Attrition-Prediction
          config_animations: yes
          use_prebuilt_image: false
